[package]
name = "visual-cpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A visual RV32IM simulator with inspectable CPU circuits and cache transactions"
repository = "https://github.com/beejmaxx/visual-cpu"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "viscpu"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 2
lto = true
